services:
  starter-database:
    image: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - "3000:3000"
    env_file:
      - .env.dev
    depends_on:
      - starter-database

  backend-prod:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    ports:
      - "4000:3000"
    env_file:
      - .env.prod
    depends_on:
      - starter-database
volumes:
  mongo_data:
